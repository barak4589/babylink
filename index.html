<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylink - הרשמת בייביסיטר</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #6c5ce7;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #5b4bc4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>הարשמת בייביסיטר</h2>
    <form id="babysitterRegisterForm">
        <div class="form-group">
            <label for="fullName">שם מלא</label>
            <input type="text" id="fullName" name="fullName" required>
        </div>

        <div class="form-group">
            <label for="email">אימייל</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">טלפון נייד</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
            <label for="age">גיל</label>
            <input type="number" id="age" name="age" min="16" max="99" required>
        </div>

        <!-- שדה כתובת מעודכן: רחוב בלבד ללא מספר בית -->
        <div class="form-group">
            <label for="street">רחוב מגורים</label>
            <input type="text" id="street" name="street" placeholder="הכנס את שם הרחוב בלבד" required>
        </div>

        <div class="form-group">
            <label for="experience">ניסיון קודם</label>
            <textarea id="experience" name="experience" rows="3" placeholder="תאר בקצרה את הניסיון שלך..."></textarea>
        </div>

        <button type="submit">הירשם כבייביסיטר</button>
    </form>
</div>

<script>
    document.getElementById('babysitterRegisterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // איסוף הנתונים מהטופס (ללא תעודת זהות, ועם רחוב בלבד)
        const formData = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            age: document.getElementById('age').value,
            street: document.getElementById('street').value,
            experience: document.getElementById('experience').value
        };

        console.log("נתוני ההרשמה שנשלחים:", formData);
        alert("הטופס נשלח בהצלחה!");
        
        // כאן בהמשך נחבר את השמירה הישירה ל-Supabase
    });
</script>

</body>
</html>
